# DSpark K=3 production profile (C1-verified); do NOT serve at util 0.85
name: dspark-k3
engine_sha: "e9fc025"
max_seq_len: 50016
max_batch_size: 8
max_prefill_tokens: 8192
dflash: true
draft_model: "/model-dspark"
dflash_gamma: 4
default_chat_template_kwargs: '{"enable_thinking":false}'
env:
  ATLAS_DISABLE_WATCHDOGS: "1"
  ATLAS_NO_MTP_DRAFTER_CONTEXT: "1"
  ATLAS_DFLASH_OPTION_B: "1"
  ATLAS_DFLASH_PROPOSE_LANES: "1"
notes:
  - "--dflash-gamma 4 means scheduler K=3"
  - "lanes=1 until the multi-lane accept-collapse bug is fixed (Phase C1) — lanes=4 is NOT healthy"
  - "fixed-engine reference: France-2048 89.31 (1.20x) / essay-2048 72.41 (1.01x); GSM8K 12/12; NIAH 12,440/44,784 exact"
